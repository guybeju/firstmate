name: Carry board tests

# The checks of the board's vendored copy on pull requests to the fork's carry
# branch: the vendor check, the Firstmate side's suites, which run against
# this fork's own hook points, and the fork's check of its setup guide. The
# board's own suites run in guybeju/myshape's CI, at every commit a sync can
# lock. Advisory: this check is not in carry's rule set, so it never blocks a
# merge, and a pull request whose files all fall outside `paths:` reports
# nothing.
#
# The suites print `skip:` and still pass when a tool is missing. This job
# installs every tool they use, so any skip fails the job and is listed as
# NOT RUN in the job summary; it never passes having checked nothing.
#
# `paths:` holds every file the suites read or run for real. That includes
# all of bin/, because the tests link the whole of bin/ into their scratch
# code roots, trip a wire named after every bin/ script, and run the real
# fm-session-start.sh and fm-fleet-snapshot.sh, whose sources reach most of it.
#
# The fork's Actions settings allow only actions pinned to a full commit SHA,
# so every `uses:` here carries one, with its release tag in the comment.
on:
  pull_request:
    branches: [carry]
    paths:
      - 'myshape/**'
      - 'myshape.lock'
      - 'fm-board/**'
      - 'dispatch-plan/**'
      - 'bin/**'
      - 'tests/lib.sh'
      - 'tests/check-fork-setup.sh'
      - 'tests/fork-setup-guide.sh'
      - 'FORK-SETUP.markdown'
      - 'README.md'
      - 'docs/**'
      - '.agents/skills/**'
      - 'ci-tools/board-tests/**'
      - '.github/workflows/carry-lint.yml'
      - '.github/workflows/carry-board-tests.yml'

# Read the repository and nothing else.
permissions:
  contents: read

# A new push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash adds -o pipefail, so `stage | tee log` fails with the stage.
    shell: bash

jobs:
  board-tests:
    name: Board tests (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          # stage-7-upgrade.sh and stage-3-handson-holds.sh read older commits.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install tasks-axi from the CI lockfile
        # ci-tools/board-tests locks tasks-axi for CI only; its pnpm entry is
        # no longer used here. No package script runs.
        run: |
          npm ci --ignore-scripts --prefix ci-tools/board-tests
          echo "$GITHUB_WORKSPACE/ci-tools/board-tests/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Show tools
        run: |
          {
            echo '## Tools'
            echo
            echo '| Tool | Path | Version |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for tool in bash git jq curl ps sha256sum ss pgrep node npm tasks-axi firefox; do
            path=$(command -v "$tool" || echo 'missing')
            # stderr is dropped: firefox writes a sandbox warning there first.
            case "$tool" in
              ps|ss|pgrep) version=$("$tool" -V 2>/dev/null | head -n 1 || true) ;;
              *) version=$("$tool" --version 2>/dev/null | head -n 1 || true) ;;
            esac
            echo "$tool: $path: $version"
            echo "| $tool | $path | $version |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run the stages
        # Every stage runs even after one fails, so one run shows them all. Each
        # logs to $RUNNER_TEMP/stages/<n>.log; its result and duration go to the
        # summary. Any `skip:` line in a log is a NOT RUN line and fails the job.
        run: |
          stages=(
            'bin/fm-board-vendor.sh --check'
            'dispatch-plan/test/run.sh'
            'fm-board/test/run.sh'
            'bash tests/fork-setup-guide.sh'
          )
          logs=$RUNNER_TEMP/stages
          mkdir -p "$logs"
          {
            echo
            echo '## Stages'
            echo
            echo '| Stage | Result | Seconds |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          not_run=()
          for i in "${!stages[@]}"; do
            stage=${stages[$i]}
            read -ra command <<< "$stage"
            echo "::group::$stage"
            start=$SECONDS
            rc=0
            "${command[@]}" 2>&1 | tee "$logs/$i.log" || rc=$?
            echo "::endgroup::"
            result=passed
            if [ "$rc" -ne 0 ]; then
              result="failed (exit $rc)"
              failed=1
              echo "::error::$stage failed with exit $rc"
            fi
            echo "| \`$stage\` | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              not_run+=("NOT RUN: $stage: $line")
            done < <(grep -E '^(ok - )?skip:' "$logs/$i.log" || true)
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "${#not_run[@]}" -eq 0 ]; then
            echo 'No stage printed a skip: line.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            failed=1
            for line in "${not_run[@]}"; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit "$failed"
